name: CI (TENSELERATE engine)
# The native from-scratch engine: a CPU-testable reference (the oracle every
# kernel is validated against) plus the CUDA kernels. This runs the reference
# tests and the host GEMM check on any runner, and compiles the CUDA kernels in
# a CUDA container so int8_gemm.cu is proven to build for the target archs. It
# cannot RUN the kernels (no GPU on the runner) — that happens on the real cards.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tenselerate/**', 'tests/tenselerate/**', 'scripts/tenselerate-*.sh', 'scripts/hercules_*.sh', 'scripts/mtp-*.py', 'benches/cmp170hx-3060/*.sh', 'benches/cmp170hx-3060/*.py', 'ggml/src/ggml-cuda/**', 'scripts/check-doc-facts.py', '.github/workflows/tenselerate-engine.yml', '.github/actions/**']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['tenselerate/**', 'tests/tenselerate/**', 'scripts/tenselerate-*.sh', 'scripts/hercules_*.sh', 'scripts/mtp-*.py', 'benches/cmp170hx-3060/*.sh', 'benches/cmp170hx-3060/*.py', 'ggml/src/ggml-cuda/**', 'scripts/check-doc-facts.py', '.github/workflows/tenselerate-engine.yml', '.github/actions/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  reference:
    name: reference (cpu) — tests, lint, host gemm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet numpy pytest flake8 flake8-no-print "ty==0.0.35"
      - name: flake8
        run: flake8 tenselerate/ tests/tenselerate/
      - name: ty type-check
        run: ty check tenselerate/ tests/tenselerate/
      - name: doc facts (no invented hardware, no invented knobs)
        run: python3 scripts/check-doc-facts.py
      - name: pytest (reference numerics + engine wiring)
        run: PYTHONPATH=. pytest tests/tenselerate/ -q
      - name: lifecycle scripts (syntax + self-tests + the Hercules launch, dry run)
        run: |
          for f in scripts/*.sh .github/actions/*.sh; do bash -n "$f"; done
          bash scripts/tenselerate-update.sh --self-test
          python3 scripts/mtp-realign-gen.py --self-test
          python3 scripts/mtp-head-train.py --self-test
          bash benches/cmp170hx-3060/run-open-items.sh --self-test
          bash benches/cmp170hx-3060/width-bytes.sh --self-test
          PYTHONPATH=. python -m tenselerate serve --backend llamacpp --model /nonexistent.gguf --dry-run
      - name: host int8 GEMM reference test
        run: |
          cmake -S tenselerate/csrc -B build-kernels -DCMAKE_BUILD_TYPE=Release
          cmake --build build-kernels --target tenselerate_gemm_test
          ctest --test-dir build-kernels --output-on-failure

  cuda-compile:
    name: cuda kernels compile (sm_80/sm_86, CMP 170HX + RTX 3060)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y cmake build-essential ninja-build
      - name: Compile CUDA kernels
        run: |
          cmake -S tenselerate/csrc -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="80-real;86-real"
          cmake --build build-cuda
      - name: Confirm the CUDA libraries and the host test all built
        run: |
          test -f build-cuda/libtenselerate_kernels.a || { echo "static CUDA lib missing"; exit 1; }
          test -f build-cuda/libtenselerate_int8_gemm_c.so || { echo "ctypes shared lib missing"; exit 1; }
          nm -D build-cuda/libtenselerate_int8_gemm_c.so | grep -q tenselerate_int8_gemm \
            || { echo "tenselerate_int8_gemm not exported from the shared lib"; exit 1; }
          ./build-cuda/tenselerate_gemm_test
          echo "ok: int8_gemm.cu compiled for sm_80;sm_86 (CMP 170HX + RTX 3060), the shared lib exports the C ABI,"
          echo "    and the reference test passed"
      - name: Compile ggml-cuda (sm_80 only) - the MMVQ routing threshold lives here
        run: |
          cmake -S . -B build-ggml-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="80-real" \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build-ggml-cuda --target ggml-cuda
          echo "ok: ggml-cuda compiled for sm_80 with GGML_CUDA_MMVQ_MAX routing"
      - name: Upload the shared library (for backend bridge smoke testing)
        uses: actions/upload-artifact@v7
        with:
          name: tenselerate-int8-gemm-cuda-so
          path: build-cuda/libtenselerate_int8_gemm_c.so
          retention-days: 7
