name: "Pull Request Labeler"
on:
- pull_request_target

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
    # pull_request_target checks out this repo's default branch, so the
    # labeler config is always the trusted copy from main - not the PR's.
    - uses: actions/checkout@v7
    - uses: actions/labeler@v7
      with:
        configuration-path: '.github/labeler.yml'
