name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Create main-b<N>-<SHA> releases for all commits
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create releases for all commits without one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/bin/bash
          set -euo pipefail

          # Get list of all commits on main
          echo "Creating releases for commits on main..."

          COMMITS=$(git rev-list main | head -150)

          for SHA in $COMMITS; do
            SHORT=$(git rev-parse --short "$SHA")
            COUNT=$(git rev-list --count "$SHORT^..$SHA" 2>/dev/null || echo "0")

            # Fallback to commit distance from root if the above fails
            if [ "$COUNT" = "0" ]; then
              COUNT=$(git rev-list --count "$SHA")
            fi

            TAG="main-b${COUNT}-${SHORT}"

            # Check if tag already exists
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "  ✓ $TAG already exists"
              continue
            fi

            # Get commit message
            MSG=$(git log -1 --pretty=%B "$SHA")

            # Create annotated tag
            git tag -a "$TAG" "$SHA" -m "$MSG"
            echo "  + Created tag $TAG"

            # Push the tag
            if git push origin "$TAG" 2>/dev/null; then
              echo "    Pushed $TAG"
            else
              echo "    Note: Could not push $TAG (may be permission issue)"
            fi
          done

          echo "Release tag creation complete."
