name: Release

# Every native-code push to main publishes a `main-b<N>-<sha>` release with the
# binaries scripts/tenselerate-update.sh downloads (`--binary`):
#   tenselerate-<tag>-bin-ubuntu-x64.tar.gz                  CPU build
#   tenselerate-<tag>-bin-ubuntu-cuda-12.8-sm80-x64.tar.gz CMP 170HX build
# <N> is `git rev-list --count HEAD`, the same number cmake/build-info.cmake
# stamps into `llama-cli --version`, so the updater can compare a running
# binary against the newest release. Docs-only pushes publish nothing.

on:
  push:
    branches: [main]
    paths-ignore:
      # A release exists to publish llama-server, llama-cli and the int8 kernel
      # bridge. Ignore only paths that cannot change those binaries: the build
      # is cmake over the repo root plus tenselerate/csrc, so anything under
      # src/, ggml/, common/, tools/, cmake/ or tenselerate/csrc must NOT be
      # listed here. Over-ignoring is the dangerous direction - it means a real
      # code change publishes nothing and the box keeps running a stale binary,
      # which is far worse than a wasted build. Add a path only when you can
      # point at why the compiler never sees it.
      - '**.md'
      - 'docs/**'
      - 'benches/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      # Python-only: the reference oracle's tests and the doc guard are never
      # compiled into anything the release ships.
      - 'tests/tenselerate/**'
      - 'scripts/check-doc-facts.py'
      # CI definitions for checks that run beside the release, not inside it.
      - '.github/workflows/doc-facts.yml'
      - '.github/workflows/tenselerate-engine.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUDA_ARCHS: "80-real"

jobs:
  meta:
    name: tag for HEAD
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      sha: ${{ steps.m.outputs.sha }}
      exists: ${{ steps.m.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: m
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)
          TAG="main-b${COUNT}-${SHORT}"
          echo "tag=$TAG"                          >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)"         >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-cpu:
    name: build bin-ubuntu-x64 (cpu)
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libcurl4-openssl-dev
      - name: Build llama-server + llama-cli
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server llama-cli
          ./build/bin/llama-cli --version
      - name: Package
        run: bash .github/actions/package-release.sh "${{ needs.meta.outputs.tag }}" cpu
      - uses: actions/upload-artifact@v7
        with:
          name: bin-ubuntu-x64
          path: dist/*.tar.gz
          retention-days: 7

  build-cuda:
    name: build bin-ubuntu-cuda-12.8-sm80-x64 (CMP 170HX)
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    # Pinned to the patch level: the binary links the CUDA runtime statically,
    # so this toolkit IS what runs on the cards. Held by
    # tests/tenselerate/test_release_triggers.py, which also holds the engine
    # workflow to the same image. NB: a workflow-level `env` cannot be used
    # here - `container:` has no access to the env context - so this is a
    # literal on purpose.
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 240
    steps:
      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake ninja-build build-essential libcurl4-openssl-dev ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build llama-server + llama-cli (CUDA, sm_80)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DGGML_CUDA_FORCE_MMQ=ON -DGGML_CUDA_DISABLE_DP4A=ON \
            -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_STATIC=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server llama-cli
          # The binaries link the CUDA driver API; the build container has no driver
          # (no GPU), so run the version stamp check against the toolkit's libcuda stub.
          mkdir -p "$RUNNER_TEMP/cuda-stubs"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-stubs/libcuda.so.1"
          ver=$(LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-stubs:${LD_LIBRARY_PATH:-}" ./build/bin/llama-cli --version 2>&1)
          printf '%s\n' "$ver"
          # The flag is only useful if it reached the binary. ggml lists it in the
          # CUDA feature line, so assert on the artifact rather than on the cmake
          # argument: a renamed or dropped option would otherwise publish silently.
          for feat in FORCE_MMQ DISABLE_DP4A; do
            printf '%s' "$ver" | grep -q "$feat" || {
              echo "::error::llama-cli does not report $feat - that build flag did not reach the binary"
              exit 1
            }
          done
      - name: Build the TENSELERATE int8 kernel bridge (.so)
        run: |
          cmake -S tenselerate/csrc -B build-kernels -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHS}"
          cmake --build build-kernels
          test -f build-kernels/libtenselerate_int8_gemm_c.so
      - name: Package
        run: bash .github/actions/package-release.sh "${{ needs.meta.outputs.tag }}" cuda-12.8-sm80
      - uses: actions/upload-artifact@v7
        with:
          name: bin-ubuntu-cuda-12.8-sm80-x64
          path: dist/*.tar.gz
          retention-days: 7

  release:
    name: publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build-cpu, build-cuda]
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Create the release with its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          ls -la assets
          {
            git log -1 --pretty=%B
            echo
            echo '---'
            echo "Assets: \`bin-ubuntu-x64\` (CPU) and \`bin-ubuntu-cuda-12.8-sm80-x64\`"
            echo "(CMP 170HX, needs the NVIDIA driver only - CUDA runtime is linked"
            echo "statically). Install: \`scripts/tenselerate-update.sh --binary\`"
            echo "(\`FLAVOR=cuda\` for the GPU build). Serve Hercules:"
            echo "\`tenselerate boot --backend llamacpp --model MODEL.gguf\`."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "$TAG" --notes-file notes.md --latest \
            assets/*.tar.gz
          echo "published $TAG"

      # Every publish adds ~1.15 GB of assets and nothing ever removed them: on
      # 2026-09-09 this repo held 58.1 GB across 31 releases. The updater
      # resolves /releases/latest, so only the newest is ever installed; the
      # rest are kept for bisecting a regression against an older binary, which
      # a handful covers. Keep KEEP_RELEASES of this fork's own releases and
      # delete the older ones, assets and all.
      #
      # Deliberately narrow: this only ever deletes releases that carry this
      # fork's CUDA asset AND are older than the newest KEEP_RELEASES of them.
      # Anything else - an upstream-matrix release, a hand-made tag, an empty
      # shell - is left alone here and handled by scripts/prune-releases.sh,
      # which a human runs. An automatic step should not be the thing that
      # decides an unfamiliar release is disposable.
      - name: Prune superseded releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: "8"
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select([.assets[].name] | any(contains("bin-ubuntu-cuda-12.8-sm80")))
                      | "\(.id)\t\(.tag_name)"' > fork-releases.txt || true
          total=$(wc -l < fork-releases.txt)
          echo "$total release(s) carry this fork's CUDA asset; keeping the newest $KEEP_RELEASES"
          if [ "$total" -le "$KEEP_RELEASES" ]; then
            echo "nothing to prune"; exit 0
          fi
          tail -n +$((KEEP_RELEASES + 1)) fork-releases.txt | while IFS=$'\t' read -r id tag; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null 2>&1; then
              echo "  pruned $tag"
            else
              echo "  could not prune $tag (continuing)"
            fi
          done
