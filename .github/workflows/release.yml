name: Release

on:
  push:
    branches: [main]
    paths: ['tenselerate/**', '.github/workflows/release.yml']
  workflow_dispatch:

jobs:
  release:
    name: Create main-b<N>-<SHA> release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get commit count and SHA
        id: commit
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=main-b${COUNT}-${SHA}" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          TAG="${{ steps.commit.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get release notes from commit message
        id: notes
        if: steps.check.outputs.exists == 'false'
        run: |
          # Get the full commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.commit.outputs.tag }}
          release_name: ${{ steps.commit.outputs.tag }}
          body: ${{ steps.notes.outputs.message }}
          draft: false
          prerelease: false
